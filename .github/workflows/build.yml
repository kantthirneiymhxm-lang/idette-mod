name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Gradle
        run: |
          for url in https://services.gradle.org/distributions/gradle-8.5-bin.zip https://downloads.gradle.org/distributions/gradle-8.5-bin.zip https://github.com/gradle/gradle-distributions/releases/download/v8.5.0/gradle-8.5-bin.zip; do
            curl -fL --retry 5 --retry-all-errors --retry-delay 5 -o gradle.zip "$url" && break
          done
          unzip -q gradle.zip -d $HOME
      - name: Build
        run: $HOME/gradle-8.5/bin/gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: idette-mod-jar
          path: build/libs/*.jar
